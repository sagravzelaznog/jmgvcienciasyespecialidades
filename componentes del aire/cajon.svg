<svg width="500mm" height="300mm" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Base para celular -->
  <rect x="50" y="200" width="100" height="10" fill="none" stroke="black" stroke-width="1"/>
  <rect x="90" y="190" width="20" height="10" fill="none" stroke="black" stroke-width="1"/>

  <!-- Bocina acústica tipo cono -->
  <path d="M200,150 Q250,100 300,150 Q250,200 200,150 Z" fill="none" stroke="black" stroke-width="1"/>

  <!-- Canal de sonido -->
  <rect x="180" y="145" width="20" height="10" fill="none" stroke="black" stroke-width="1"/>

  <!-- Piezas laterales encajables -->
  <rect x="50" y="50" width="10" height="100" fill="none" stroke="black" stroke-width="1"/>
  <rect x="440" y="50" width="10" height="100" fill="none" stroke="black" stroke-width="1"/>

  <!-- Agujeros para ensamblaje -->
  <circle cx="60" cy="60" r="3" stroke="black" fill="none"/>
  <circle cx="450" cy="60" r="3" stroke="black" fill="none"/>
</svg>

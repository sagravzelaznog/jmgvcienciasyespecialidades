<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <title>Estructura Atómica de Conductores y Aislantes</title>
    <style>
        .title { font: bold 16px Arial; text-anchor: middle; }
        .subtitle { font: 12px Arial; text-anchor: middle; }
        .nucleus { fill: #e74c3c; }
        .electron { fill: #3498db; }
        .conductor { fill: #f1c40f; opacity: 0.7; }
        .insulator { fill: #2ecc71; opacity: 0.7; }
        .electron-path { fill: none; stroke: #7f8c8d; stroke-dasharray: 5,5; }
        .arrow { stroke: #e74c3c; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    
    <defs>
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" />
        </marker>
    </defs>
    
    <!-- Conductor -->
    <rect x="20" y="40" width="160" height="220" rx="10" class="conductor" />
    <text x="100" y="30" class="title">Conductor (Cobre)</text>
    <text x="100" y="60" class="subtitle">Electrones libres</text>
    
    <!-- Átomo de cobre -->
    <circle cx="100" cy="120" r="30" class="nucleus" />
    <text x="100" y="125" fill="white" text-anchor="middle" font-size="12">+29</text>
    
    <!-- Electrones libres -->
    <circle cx="50" cy="180" r="8" class="electron" />
    <circle cx="150" cy="200" r="8" class="electron" />
    <circle cx="80" cy="220" r="8" class="electron" />
    <path d="M100,150 A50,50 0 1,1 100,250 A50,50 0 1,1 100,150" class="electron-path" />
    
    <!-- Aislante -->
    <rect x="220" y="40" width="160" height="220" rx="10" class="insulator" />
    <text x="300" y="30" class="title">Aislante (Plástico)</text>
    <text x="300" y="60" class="subtitle">Electrones fijos</text>
    
    <!-- Átomo de plástico -->
    <circle cx="300" cy="120" r="30" class="nucleus" />
    <text x="300" y="125" fill="white" text-anchor="middle" font-size="12">+6</text>
    
    <!-- Electrones fijos -->
    <circle cx="260" cy="150" r="8" class="electron" />
    <circle cx="300" cy="160" r="8" class="electron" />
    <circle cx="340" cy="150" r="8" class="electron" />
    <circle cx="280" cy="190" r="8" class="electron" />
    <circle cx="320" cy="190" r="8" class="electron" />
    
    <!-- Flechas de explicación -->
    <line x1="170" y1="100" x2="220" y2="100" class="arrow" />
    <text x="195" y="95" font-size="10" text-anchor="middle">Electrones libres</text>
    
    <line x1="170" y1="140" x2="220" y2="140" class="arrow" />
    <text x="195" y="135" font-size="10" text-anchor="middle">Átomos en red</text>
    
    <line x1="170" y1="180" x2="220" y2="180" class="arrow" />
    <text x="195" y="175" font-size="10" text-anchor="middle">Flujo de corriente</text>
</svg>

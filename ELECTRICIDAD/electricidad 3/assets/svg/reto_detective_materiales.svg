<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="500" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
    <title>Reto: El Detective de Materiales</title>
    <style>
        .title { font: bold 24px Arial; text-anchor: middle; fill: #2c3e50; }
        .subtitle { font: bold 16px Arial; text-anchor: middle; fill: #34495e; }
        .item { font: 12px Arial; }
        .conductor { fill: #f1c40f; stroke: #d35400; }
        .insulator { fill: #2ecc71; stroke: #27ae60; }
        .magnifier { fill: none; stroke: #7f8c8d; stroke-width: 2; }
        .points { font: bold 14px Arial; fill: #e74c3c; }
    </style>

    <!-- Título -->
    <text x="300" y="40" class="title">Reto: El Detective de Materiales</text>
    <text x="300" y="70" class="subtitle">Identifica conductores y aislantes en objetos cotidianos</text>
    
    <!-- Instrucciones -->
    <rect x="50" y="90" width="500" height="80" fill="#f8f9fa" rx="5" />
    <text x="300" y="115" class="subtitle" text-anchor="middle">Instrucciones:</text>
    <text x="80" y="140" class="item">1. Toma fotos de 5 objetos en tu casa que contengan tanto materiales conductores como aislantes.</text>
    <text x="80" y="160" class="item">2. Explica la función de cada material en el objeto.</text>
    
    <!-- Ejemplo 1 -->
    <rect x="50" y="190" width="240" height="140" fill="white" rx="5" stroke="#ddd" />
    <rect x="60" y="200" width="100" height="80" fill="#f0f0f0" rx="5" />
    <text x="180" y="220" class="subtitle">Ejemplo: Secadora de pelo</text>
    
    <!-- Lupa sobre el ejemplo -->
    <circle cx="110" cy="240" r="30" class="magnifier" />
    <line x1="110" y1="270" x2="110" y2="310" class="magnifier" />
    
    <!-- Explicación -->
    <rect x="60" y="250" width="160" height="70" fill="#f8f9fa" rx="5" />
    <text x="70" y="270" class="item">• Cable (conductor): Transmite electricidad</text>
    <text x="70" y="290" class="item">• Mango (aislante): Protege contra descargas</text>
    <text x="70" y="310" class="item">• Rejilla (conductor): Disipa calor</text>
    
    <!-- Puntuación -->
    <text x="200" y="350" class="points">+20 puntos por objeto correcto</text>
    <text x="200" y="380" class="points">+10 puntos de bono por creatividad</text>
    
    <!-- Objetos para identificar -->
    <text x="300" y="420" class="subtitle" text-anchor="middle">Objetos para encontrar:</text>
    <g transform="translate(50, 440)">
        <rect x="0" y="0" width="20" height="20" rx="3" class="conductor" />
        <text x="30" y="15" class="item">1. _____________________</text>
        
        <rect x="200" y="0" width="20" height="20" rx="3" class="conductor" />
        <text x="230" y="15" class="item">2. _____________________</text>
        
        <rect x="400" y="0" width="20" height="20" rx="3" class="conductor" />
        <text x="430" y="15" class="item">3. _____________________</text>
    </g>
    
    <g transform="translate(50, 470)">
        <rect x="0" y="0" width="20" height="20" rx="3" class="conductor" />
        <text x="30" y="15" class="item">4. _____________________</text>
        
        <rect x="200" y="0" width="20" height="20" rx="3" class="conductor" />
        <text x="230" y="15" class="item">5. _____________________</text>
        
        <rect x="400" y="0" width="100" height="20" rx="10" fill="#3498db" />
        <text x="450" y="15" class="item" fill="white" text-anchor="middle">Enviar</text>
    </g>
</svg>
